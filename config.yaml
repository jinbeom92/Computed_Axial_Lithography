data:
  sino_dir: data/sino
  voxel_dir: data/voxel
  batch_size: 4
  num_workers: 4
  prefetch_factor: 4

model:
  c1d: 64
  c2d: 64
  fusion_out: 64
  align_out: 64
  decoder_hidden: 128
  cheat:
    enabled: true
    train_only: false
    out_ch: 64
bp:
  filter: None         # ramp | shepp-logan | cosine | hamming | hann | None
  output_size: null
  angle_chunk: 32

optim:
  lr: 1.0e-2
  weight_decay: 1.0e-5
  betas: [0.9, 0.999]
  eps: 1.0e-8

train:
  epochs: 1000
  val_split: 0.0
  val_copy: false
  seed: 2025
  device: auto            # auto | cuda | cpu
  grad_clip: 1.0

loss_weights:
  w_mse: 1.0
  w_ec:  0.3
  w_ssim: 0.7
  w_psf: 0.1
  w_tv: 0.002
  w_gdl: 0.01

save:
  dir: results/ckpt